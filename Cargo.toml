[workspace]
resolver = "2"
members = [
    "crates/glide-core",
    "crates/glide-cli",
    "crates/glide-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/Eth-Interchained/glide"
homepage = "https://github.com/Eth-Interchained/glide"
authors = ["Interchained LLC"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nedb-engine = "=2.8.6"
forge-ui = "0.2"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = "0.3"
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
