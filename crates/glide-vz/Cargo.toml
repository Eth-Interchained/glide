[package]
name = "glide-vz"
description = "Glide backend on Apple Virtualization.framework (macOS only) via objc2-virtualization"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# This crate only produces a working backend on macOS. On every other
# platform it compiles to a stub that reports unavailability, so the
# workspace builds and tests on Linux CI. The real backend is compiled and
# verified on the Mac host it targets.

[dependencies]
glide-core = { path = "../glide-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
libc = "0.2"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSError"] }
objc2-virtualization = { version = "0.3", features = [
    "VZVirtualMachine",
    "VZVirtualMachineConfiguration",
    "VZBootLoader",
    "VZEFIBootLoader",
    "VZEFIVariableStore",
    "VZPlatformConfiguration",
    "VZGenericPlatformConfiguration",
    "VZStorageDeviceConfiguration",
    "VZDiskImageStorageDeviceAttachment",
    "VZVirtioBlockDeviceConfiguration",
    "VZUSBMassStorageDeviceConfiguration",
    "VZEntropyDeviceConfiguration",
    "VZVirtioEntropyDeviceConfiguration",
    "VZNetworkDeviceConfiguration",
    "VZVirtioNetworkDeviceConfiguration",
    "VZNetworkDeviceAttachment",
    "VZNATNetworkDeviceAttachment",
    "VZSerialPortConfiguration",
    "VZFileHandleSerialPortAttachment",
] }
